    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice App</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-900 min-h-screen text-white antialiased">

  <div class="max-w-4xl mx-auto px-4 py-10">

    <!-- Header -->
    <header class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-bold">Invoice App</h1>
        <p class="text-slate-400 text-sm mt-1">Organize your invoices easily</p>
      </div>

      <!-- Emergency Button -->
      <button
        id="inflation-btn"
        class="bg-red-600 hover:bg-red-700 transition px-4 py-2 rounded-lg text-sm font-semibold shadow-lg shadow-red-900/40"
      >
        🚨 سكّر المعبر
      </button>
    </header>

    <!-- Products Inputs -->
    <section class="bg-slate-800 rounded-xl p-6 shadow-lg">
      <h2 class="text-lg font-semibold mb-4">Products</h2>

      <div id="products-container" class="space-y-3">

        <!-- Initial Row -->
        <div class="product-row flex gap-3 items-center">
          <input
            type="text"
            name="name"
            placeholder="Product Name"
            class="flex-1 bg-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-amber-500"
          />
          <input
            type="number"
            name="price"
            placeholder="Price"
            min="0"
            class="w-32 bg-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-amber-500"
          />
          <button
            class="remove-row-btn bg-slate-700 hover:bg-red-600 transition w-9 h-9 rounded-lg text-lg leading-none"
            title="Remove"
          >×</button>
        </div>

      </div>

      <!-- Add Row -->
      <button
        id="add-row-btn"
        class="mt-4 flex items-center gap-2 text-amber-400 hover:text-amber-300 font-medium text-sm transition"
      >
        <span class="w-7 h-7 flex items-center justify-center rounded-full bg-amber-500/20 text-lg leading-none">+</span>
        Add Product
      </button>

      <!-- Generate Invoice -->
      <button
        id="generate-btn"
        class="w-full mt-6 bg-amber-500 hover:bg-amber-600 transition text-slate-900 font-bold py-3 rounded-lg"
      >
        إنشاء فاتورة
      </button>
    </section>

    <!-- Invoice Area -->
    <section id="invoice-area" class="hidden mt-8 bg-slate-800 rounded-xl p-6 shadow-lg">
      <h2 class="text-lg font-semibold mb-4">Invoice</h2>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="text-slate-400 border-b border-slate-700">
              <th class="py-2 px-2">#</th>
              <th class="py-2 px-2">Product</th>
              <th class="py-2 px-2 text-right">Price</th>
            </tr>
          </thead>
          <tbody id="invoice-body"></tbody>
        </table>
      </div>

      <!-- Totals -->
      <div class="mt-6 pt-4 border-t border-slate-700 space-y-2">

        <div class="flex items-center justify-between text-slate-400">
          <span>Subtotal</span>
          <span id="subtotal">0</span>
        </div>

        <div class="flex items-center justify-between">
          <span>Total</span>
          <span id="total" class="text-2xl font-bold text-amber-400">0</span>
        </div>

        <!-- Coupon -->
        <div class="flex items-center justify-between">
          <button
            id="coupon-toggle"
            class="text-sm text-slate-400 hover:text-amber-400 transition underline underline-offset-4"
          >
            Have coupon?
          </button>
          <span id="discount-label" class="text-sm text-green-400 hidden">-20% applied</span>
        </div>

        <div id="coupon-box" class="hidden flex gap-2 mt-2">
          <input
            id="coupon-input"
            type="text"
            placeholder="Enter coupon code"
            class="flex-1 bg-slate-700 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-amber-500 text-sm"
          />
          <button
            id="apply-coupon"
            class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 rounded-lg text-sm transition"
          >
            Apply
          </button>
        </div>

      </div>
    </section>

  </div>

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="script.js"></script>
</body>
</html>
    

    <script src="script.js"></script>
</body>
</html>
